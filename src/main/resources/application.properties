spring.application.name=shop-secure
spring.datasource.url=jdbc:h2:mem:shop
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

shop.seed.admin-password=${SHOP_SEED_ADMIN_PASSWORD:Admin-pass-123}
shop.seed.customer-password=${SHOP_SEED_CUSTOMER_PASSWORD:Alice-pass-123}

shop.security.jwt-secret=${JWT_SECRET}
shop.security.access-token-ttl=15m

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level rid=%X{rid} %logger{0} : %msg%n